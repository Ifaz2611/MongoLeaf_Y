<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangoLeaf_Y - Mango Leaf Disease Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">🍃 MangoLeaf_Y</h1>
        </header>

        <main class="content">
            <div class="upload-section">
                <h2>Upload Your Mango Leaf</h2>
                <input type="file" id="imageInput" accept="image/*" onchange="displayImage(event)">
                <img id="previewImage" src="#" alt="Uploaded Image Preview" style="display: none;">
                <button onclick="predictDisease()">Predict Disease</button>
            </div>

            <div class="result-section">
                <h2>Prediction Result</h2>
                <div id="result-box">
                    <div id="result">Your result will be displayed here.</div>
                    <div id="suggestion" class="suggestion">Your suggestions will appear here.</div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 MangoLeaf_Y - All rights reserved | Built with care for Farmers &amp; Researchers</p>
        <p>Developed by <a href="https://ifazzahin.vercel.app/" target="_blank">Ifaz Md Zahin</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
